<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>GCDS Wrapper for Blazor</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="GcdsWrapper.Demo.styles.css" />
</head>
<body>
    <div id="app">
        <p class="loading">Loading documentation… / Chargement de la documentation…</p>
    </div>
    <div id="blazor-error-ui">
        An unexpected error occurred. Une erreur inattendue s’est produite.
        <a href="." class="reload">Reload / Recharger</a>
    </div>
    <script src="docsInterop.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (type === "dotnetjs") {
                    return null;
                }

                return fetch(defaultUri, {
                    cache: "no-cache",
                    integrity: integrity
                });
            }
        });
    </script>
</body>
</html>
