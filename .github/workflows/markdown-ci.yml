name: Markdown continuous integration

on:
  pull_request:
    paths:
      - "GcdsWrapper.Blazor.Markdown/**"
      - "GcdsWrapper.Blazor.Markdown.Tests/**"
      - "GcdsWrapper.Blazor/**"
      - "GcdsWrapper.Demo/**"
      - ".github/workflows/markdown-*.yml"
      - ".github/workflows/pages.yml"
      - "global.json"
  push:
    branches:
      - main
    paths:
      - "GcdsWrapper.Blazor.Markdown/**"
      - "GcdsWrapper.Blazor.Markdown.Tests/**"
      - "GcdsWrapper.Blazor/**"
      - "GcdsWrapper.Demo/**"
      - ".github/workflows/markdown-*.yml"
      - ".github/workflows/pages.yml"
      - "global.json"

permissions:
  contents: read

concurrency:
  group: markdown-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test, and validate Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GcdsWrapper.Blazor.Markdown.Tests/GcdsWrapper.Blazor.Markdown.Tests.csproj

      - name: Verify library formatting
        run: dotnet format GcdsWrapper.Blazor.Markdown/GcdsWrapper.Blazor.Markdown.csproj --verify-no-changes --no-restore

      - name: Verify test formatting
        run: dotnet format GcdsWrapper.Blazor.Markdown.Tests/GcdsWrapper.Blazor.Markdown.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        run: >-
          dotnet build GcdsWrapper.Blazor.Markdown.Tests/GcdsWrapper.Blazor.Markdown.Tests.csproj
          -c Release
          --no-restore
          --property:TreatWarningsAsErrors=true

      - name: Test
        run: >-
          dotnet test --project GcdsWrapper.Blazor.Markdown.Tests/GcdsWrapper.Blazor.Markdown.Tests.csproj
          -c Release
          --no-restore
          --no-build

      - name: Validate package
        run: >-
          dotnet pack GcdsWrapper.Blazor.Markdown/GcdsWrapper.Blazor.Markdown.csproj
          -c Release
          --no-restore
          --no-build
          --output artifacts
          --property:TreatWarningsAsErrors=true

      - name: Publish documentation
        run: >-
          dotnet publish GcdsWrapper.Demo/GcdsWrapper.Demo.csproj
          -c Release
          --no-restore
          --no-build
          --property:TreatWarningsAsErrors=true
