name: Deploy documentation to GitHub Pages

on:
  workflow_run:
    workflows: ["Publish NuGet package", "Publish GCDS Markdown NuGet package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GcdsWrapper.Blazor.Tests/GcdsWrapper.Blazor.Tests.csproj

      - name: Test
        run: dotnet test --project GcdsWrapper.Blazor.Tests/GcdsWrapper.Blazor.Tests.csproj -c Release --no-restore

      - name: Publish documentation
        run: dotnet publish GcdsWrapper.Demo/GcdsWrapper.Demo.csproj -c Release --no-restore

      - name: Prepare static site
        shell: bash
        run: |
          output="GcdsWrapper.Demo/bin/Release/net10.0/publish/wwwroot"
          repository="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          if [[ "$repository" == "$owner.github.io" ]]; then
            base_path="/"
          else
            base_path="/$repository/"
          fi
          sed -i -E "s|<base href=\"[^\"]*\" ?/>|<base href=\"$base_path\" />|" "$output/index.html"
          cp "$output/index.html" "$output/404.html"
          touch "$output/.nojekyll"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: GcdsWrapper.Demo/bin/Release/net10.0/publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
