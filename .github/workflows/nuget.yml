name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, pack, and verify
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a supported semantic version tag." >&2
            exit 1
          fi

          project_version="$(dotnet msbuild GcdsWrapper.Blazor/GcdsWrapper.Blazor.csproj \
            -getProperty:Version -nologo)"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version '$version' does not match project version '$project_version'." >&2
            exit 1
          fi

          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore GcdsWrapper.Blazor.Tests/GcdsWrapper.Blazor.Tests.csproj

      - name: Test
        run: dotnet test --project GcdsWrapper.Blazor.Tests/GcdsWrapper.Blazor.Tests.csproj -c Release --no-restore

      - name: Verify formatting
        run: dotnet format GcdsWrapper.Blazor/GcdsWrapper.Blazor.csproj --verify-no-changes --no-restore

      - name: Pack
        run: >-
          dotnet pack GcdsWrapper.Blazor/GcdsWrapper.Blazor.csproj
          -c Release
          --no-restore
          --output artifacts
          --property:PackageVersion=${{ steps.version.outputs.package_version }}
          --property:TreatWarningsAsErrors=true

      - name: Verify package in a consuming app
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/GcdsWrapper.PackageSmokeTest"
          dotnet new blazorwasm --name PackageSmokeTest --output "$smoke" --framework net10.0 --no-restore
          dotnet add "$smoke/PackageSmokeTest.csproj" package GcdsWrapper.Blazor \
            --version "${{ steps.version.outputs.package_version }}" \
            --source "$GITHUB_WORKSPACE/artifacts" \
            --no-restore
          dotnet restore "$smoke/PackageSmokeTest.csproj" \
            --source "$GITHUB_WORKSPACE/artifacts" \
            --source https://api.nuget.org/v3/index.json
          dotnet publish "$smoke/PackageSmokeTest.csproj" -c Release --no-restore
          test -f "$smoke/bin/Release/net10.0/publish/wwwroot/_content/GcdsWrapper.Blazor/gcdsInterop.js"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GcdsWrapper.Blazor-${{ steps.version.outputs.package_version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: build
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: GcdsWrapper.Blazor-${{ needs.build.outputs.package_version }}
          path: artifacts

      - name: Authenticate to NuGet.org
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: GcdsWrapper.Blazor-${{ needs.build.outputs.package_version }}
          path: artifacts

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
        run: |
          prerelease_args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.nupkg \
            artifacts/*.snupkg \
            --verify-tag \
            --generate-notes \
            "${prerelease_args[@]}"
